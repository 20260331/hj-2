server:
  port: 8080
  servlet:
    context-path: /idempotent

spring:
  application:
    name: idempotent-service
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

idempotent:
  token:
    prefix: "idempotent:token:"
    expire-time: 600
    header-name: "Idempotent-Token"
